apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configmap
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width,initial-scale=1" />
      <title>Welcome — Demo Site</title>
      <style>
        :root{--bg:#0b1220;--accent:#06b6d4;--muted:#9aa4b2}
        *{box-sizing:border-box}
        html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,var(--bg),#071428);color:#e6eef6}
        .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:2rem}
        .card{max-width:820px;text-align:center;padding:2.25rem;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));box-shadow:0 8px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
        h1{font-size:2.25rem;margin:.25rem 0}
        p{color:var(--muted);margin:.5rem 0 1rem}
        .pill{display:inline-block;margin-top:1rem;padding:.5rem 1rem;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7c3aed);color:#04111a;font-weight:700}
        @media (max-width:520px){h1{font-size:1.5rem}.card{padding:1.25rem}}
      </style>
    </head>
    <body>
      <div class="wrap">
        <div class="card">
          <h1>Welcome to the Demo Site</h1>
          <p>Your Nginx server is successfully running in Kubernetes!</p>
          <div class="pill">Demo Complete</div>
        </div>
      </div>
    </body>
    </html>