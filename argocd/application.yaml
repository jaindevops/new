apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: abhi-argocd
  namespace: argocd
spec:
  project: Abhi
  source:
    repoURL: https://github.com/jaindevops/new.git
    targetRevision: argocd
    path: new/nginx # Corrected path to your Kubernetes manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
