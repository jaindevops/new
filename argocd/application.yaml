apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: abhi-argocd-parent
  namespace: argocd
spec:
  project: abhi
  source:
    repoURL: git@github.com:jaindevops/new.git
    targetRevision: argocd
    path: argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
